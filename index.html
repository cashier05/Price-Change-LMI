<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRICE CHANGE-05</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Lotte_logo.svg/512px-Lotte_logo.svg.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f4;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #c8102e;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: baseline;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-shrink: 0;
            z-index: 10;
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 0.12em;
            line-height: 1;
        }

        .logo-sub {
            font-weight: 400;
            font-size: 0.8rem;
            opacity: 0.9;
            letter-spacing: 0.05em;
            border-left: 1px solid rgba(255,255,255,0.5);
            padding-left: 12px;
        }

        .iframe-container {
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
            background-color: #fff;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- HEADER LOGO LOTTE MART -->
    <div class="header">
        <div class="logo-text">LOTTE MART</div>
        <div class="logo-sub">CASHIER LMI-05</div>
    </div>

    <!-- AREA IFRAME -->
    <div class="iframe-container">
        <iframe
            id="app"
            src="https://script.google.com/macros/s/AKfycbzJnCv_bIfC9sZzYthgsgbNI_98g3eR0q6Db8UheusVuxOF5DZOyiwQE959QMLr_u7y/exec"
            allow="fullscreen; camera; microphone; display-capture; geolocation">
        </iframe>
    </div>

</body>
</html>
